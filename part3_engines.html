/* ── TAX: Hong Kong salaries tax + MPF (IRD 2025/26 method) ─────── */
const TAX = {
  // IRD 2025/26: basic allowance
  BASIC_ALLOWANCE: 132000,
  // Progressive bands on NET CHARGEABLE INCOME (= income after allowances & deductions)
  BANDS: [ [50000, .02], [50000, .06], [50000, .10], [50000, .14], [Infinity, .17] ],
  STANDARD_RATE: .15,
  MPF_RATE: .05, MPF_INCOME_CAP: 30000, MPF_MAX: 1500,

  mpfEmployee(monthlyIncome) {
    if (monthlyIncome < 7100) return 0;             // no contribution below HK$7,100
    return Math.round(Math.min(monthlyIncome, this.MPF_INCOME_CAP) * this.MPF_RATE);
  },
  mpfEmployer(monthlyIncome) {
    if (monthlyIncome < 7100) return 0;
    return Math.round(Math.min(monthlyIncome, this.MPF_INCOME_CAP) * this.MPF_RATE);
  },
  /* Salaries tax for one year of employment.
     income = annual gross; mpfDeduct = annual mandatory MPF employee contributions
     (deductible). Tax = min(progressive on net chargeable, standard on net income). */
  annualTax(annualGross, annualMpf) {
    const netIncome = Math.max(0, annualGross - annualMpf);          // for standard rate
    const netChargeable = Math.max(0, annualGross - annualMpf - this.BASIC_ALLOWANCE);
    // progressive
    let remaining = netChargeable, prog = 0;
    for (const [width, rate] of this.BANDS) {
      const slice = Math.min(remaining, width);
      prog += slice * rate; remaining -= slice;
      if (remaining <= 0) break;
    }
    // standard rate on net income (before allowances)
    const std = netIncome * this.STANDARD_RATE;
    return { tax: Math.round(Math.min(prog, std)), prog: Math.round(prog), std: Math.round(std), netChargeable, netIncome };
  },
  /* Full monthly payslip computation */
  payslip(monthlyGross) {
    const g = Math.max(0, Number(monthlyGross) || 0);
    const mpfM = this.mpfEmployee(g);
    const annualGross = g * 12;
    const annualMpf = mpfM * 12;
    const t = this.annualTax(annualGross, annualMpf);
    const taxM = Math.round(t.tax / 12);
    return {
      gross: g, mpf: mpfM, mpfEr: this.mpfEmployer(g),
      annualTax: t.tax, taxM: taxM, method: t.prog <= t.std ? "progressive" : "standard",
      net: Math.max(0, g - mpfM - taxM)
    };
  },
  /* Self-tests (run on load; failures log to console) */
  selfTest() {
    // Engine-verified expectations: MPF deducted at actual amount (5% of salary,
    // capped), then IRD bands on net chargeable income.
    const expect = sal => {
      const mpf = TAX.mpfEmployee(sal);
      const nc = sal * 12 - mpf * 12 - TAX.BASIC_ALLOWANCE;
      let remaining = nc, p = 0;
      for (const [w, r] of TAX.BANDS) { const s = Math.min(remaining, w); p += s * r; remaining -= s; if (remaining <= 0) break; }
      return Math.round(Math.min(p, (sal * 12 - mpf * 12) * TAX.STANDARD_RATE));
    };
    const t26 = this.payslip(26000);
    const ok26 = t26.annualTax === expect(26000) && expect(26000) === 11016; // IRD-verified: 1000+3000+5000+2016
    const t21 = this.payslip(21000);
    const ok21 = t21.annualTax === expect(21000) && expect(21000) === 4740;  // 1000+3000+740
    const low = this.payslip(8000);   // below allowance -> zero tax
    const okLow = low.annualTax === 0;
    const cap = this.payslip(50000);  // MPF capped
    const okCap = cap.mpf === 1500;
    const tiny = this.payslip(5000);  // below 7100 -> no MPF
    const okTiny = tiny.mpf === 0 && tiny.net === 5000;
    console.log("[TAX.selfTest]", { ok21, ok26, okLow, okCap, okTiny },
      { tax21: t21.annualTax, tax26: t26.annualTax });
    return ok21 && ok26 && okLow && okCap && okTiny;
  }
};

/* ── BUDGET: HK-graduate-realistic allocation ───────────────────── */
const BUDGET = {
  // 2025-26 HK student living-cost references (uhomes/dash/student guides)
  REF: { rent: 6800, food: 2800, transport: 800, bills: 500 },
  essentials() { return this.REF.rent + this.REF.food + this.REF.transport + this.REF.bills; },
  suggest(net) {
    // Needs anchored on real HK costs, not a US rule
    const need = Math.min(Math.round(this.essentials() / net * 100), 75);
    const want = Math.max(10, Math.min(25, Math.round((100 - need) * .35)));
    return { need, want, future: 100 - need - want };
  }
};

/* ── RUNWAY: emergency fund simulator ───────────────────────────── */
const RUNWAY = {
  TARGET_MONTHS: 3,
  months(saved, essentials) { return essentials > 0 ? saved / essentials : 0; },
  monthsToTarget(saved, monthlySave, target) {
    if (saved >= target) return 0;
    if (monthlySave <= 0) return Infinity;
    return Math.ceil((target - saved) / monthlySave);
  }
};

/* ── GROW: self-investment ledger ───────────────────────────────── */
const GROW = {
  stats(items) {
    if (!items.length) return { total: 0, monthly: 0, payback: 0 };
    const total = items.reduce((s, i) => s + Number(i.cost || 0), 0);
    const monthly = items.reduce((s, i) => s + Number(i.gain || 0), 0);
    return { total, monthly, payback: monthly > 0 ? (total / monthly) : Infinity };
  }
};
