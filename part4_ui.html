/* ── Pay screen logic ───────────────────────────────────────────── */
function setSalary(v) { UI.$("salaryIn").value = v; STATE.data.salary = v; STATE.save(); computePay(); }
function computePay() {
  const slip = TAX.payslip(UI.$("salaryIn").value);
  UI.$("v_gross").textContent = UI.fmt(slip.gross);
  UI.$("v_mpf").textContent = "− " + UI.fmt(slip.mpf);
  UI.$("v_mpfEr").textContent = "+ " + UI.fmt(slip.mpfEr);
  UI.$("v_taxM").textContent = "− " + UI.fmt(slip.taxM);
  UI.$("v_net").textContent = UI.fmt(slip.net);
  STATE.data.salary = slip.gross; STATE.data._net = slip.net;
  allocChanged(false);
  STATE.save();
}
function allocChanged(save = true) {
  const net = STATE.data._net || TAX.payslip(STATE.data.salary).net;
  let need = +UI.$("r_need").value, want = +UI.$("r_want").value;
  let future = 100 - need - want;
  if (future < 0) { want = 100 - need - 5; future = 5; UI.$("r_want").value = want; }
  const b = [need, want, future], n = [UI.$("bv1"), UI.$("bv2"), UI.$("bv3")], p = [UI.$("bp1"), UI.$("bp2"), UI.$("bp3")];
  b.forEach((v, i) => { n[i].textContent = UI.fmt(net * v / 100); p[i].textContent = v + "%"; });
  UI.$("rv_need").textContent = need + "%"; UI.$("rv_want").textContent = want + "%";
  UI.$("bk3").classList.toggle("warn", future < 15);
  if (save) { STATE.data.alloc = { need, want }; STATE.save(); }
}

/* ── Runway logic ───────────────────────────────────────────────── */
function computeRunway() {
  const net = STATE.data._net || TAX.payslip(STATE.data.salary).net;
  const needPct = STATE.data.alloc.need;
  const essentials = net * needPct / 100;
  const saved = +UI.$("r_start").value, monthly = +UI.$("r_save").value;
  UI.$("rv_save").textContent = UI.fmt(monthly); UI.$("rv_start").textContent = UI.fmt(saved);
  const target = essentials * RUNWAY.TARGET_MONTHS;
  const months = RUNWAY.months(saved, essentials);
  UI.$("runBig").innerHTML = months.toFixed(1) + ' <small id="runUnit">' + I18N.t("unit") + "</small>";
  UI.$("runSub").textContent = I18N.t("runSubNow") + " ・ " + I18N.t("lg_target") + " " + UI.fmt(target);
  const toGo = RUNWAY.monthsToTarget(saved, monthly, target);
  UI.$("simOut").textContent = toGo === 0 ? "🎉 " + I18N.t("lg_target") + "！" :
    (toGo === Infinity ? "⚠️ 每月儲蓄 = 0" : I18N.t("simMonths").replace("{n}", toGo));
  STATE.data.saved = saved; STATE.data.monthlySave = monthly; STATE.save();
  UI.drawRunway();
}
UI.drawRunway = function () {
  const c = UI.$("runCanvas"); if (!c) return;
  const ctx = c.getContext("2d");
  const W = c.width = c.clientWidth * 2 || 700; c.height = 300 * (W > 700 ? W / 700 : 1);
  const H = c.height, pad = 50;
  ctx.clearRect(0, 0, W, H);
  const net = STATE.data._net || TAX.payslip(STATE.data.salary).net;
  const essentials = net * STATE.data.alloc.need / 100;
  const target = essentials * RUNWAY.TARGET_MONTHS;
  const saved = STATE.data.saved || 0, monthly = STATE.data.monthlySave || 0;
  const maxV = Math.max(target * 1.15, saved + monthly * 6, 1);
  // target line
  const ty = H - pad - (target / maxV) * (H - 2 * pad);
  ctx.strokeStyle = "#6b7f9c"; ctx.setLineDash([8, 6]); ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(pad, ty); ctx.lineTo(W - pad / 2, ty); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = "#6b7f9c"; ctx.font = "600 22px sans-serif";
  ctx.fillText("🎯 3 " + (STATE.data.lang === "zh" ? "個月目標" : "months target"), pad, ty - 10);
  // months 0..6 savings path
  const n = 6, bw = (W - pad * 1.5) / n;
  for (let i = 0; i <= n; i++) {
    const v = saved + monthly * i;
    const x = pad + bw * i, y = H - pad - (v / maxV) * (H - 2 * pad);
    ctx.fillStyle = i === 0 ? "#f5c451" : "rgba(245,196,81,.55)";
    const r = Math.min(10, bw / 3);
    ctx.beginPath(); ctx.roundRect(x - r, y - r, r * 2, r * 2, r); ctx.fill();
    if (i > 0) { ctx.strokeStyle = "#3ddc97"; ctx.lineWidth = 3; ctx.beginPath();
      ctx.moveTo(pad + bw * (i - 1), H - pad - ((saved + monthly * (i - 1)) / maxV) * (H - 2 * pad));
      ctx.lineTo(x, y); ctx.stroke(); }
    ctx.fillStyle = "#6b7f9c"; ctx.font = "600 20px sans-serif"; ctx.textAlign = "center";
    ctx.fillText("M" + i, x, H - pad + 26); ctx.textAlign = "left";
  }
  // axes
  ctx.strokeStyle = "#24395a"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(pad, pad / 2); ctx.lineTo(pad, H - pad); ctx.lineTo(W - pad / 3, H - pad); ctx.stroke();
};

/* ── Shield logic ───────────────────────────────────────────────── */
function loadExample(i) {
  const ex = SHIELD.EXAMPLES[i];
  UI.$("scamIn").value = STATE.data.lang === "zh" ? ex.zh : ex.en;
  runShield();
}
function liveShield() { /* debounce-free light preview: only clear output when editing */
  if (UI.$("shieldOut") && UI.$("shieldOut").classList.contains("hidden")) return;
  clearTimeout(UI._shieldT); UI._shieldT = setTimeout(runShield, 400);
}
function runShield() {
  const msg = UI.$("scamIn").value;
  const r = SHIELD.analyze(msg);
  const out = UI.$("shieldOut");
  if (!msg.trim()) { out.classList.add("hidden"); return; }
  out.classList.remove("hidden");
  const zh = STATE.data.lang === "zh";
  // ring
  const arc = UI.$("riskArc"), C = 207;
  const col = r.level === "high" ? "#ff6b6b" : r.level === "medium" ? "#f5a04b" : r.level === "low" ? "#f5c451" : "#3ddc97";
  arc.style.stroke = col; arc.style.strokeDashoffset = C - C * r.score / 100;
  UI.$("riskNum").textContent = r.score; UI.$("riskNum").setAttribute("fill", col);
  UI.$("riskTitle").textContent = zh ? r.zh : r.en;
  UI.$("riskSub").textContent = zh ? "觸發 " + r.hits.filter(h => h.w > 0).length + " 條紅旗規則" :
    r.hits.filter(h => h.w > 0).length + " red-flag rules triggered";
  // type tags
  const tags = UI.$("typeTags"); tags.innerHTML = "";
  r.types.forEach(t => {
    const info = SHIELD.TYPES[t];
    const s = document.createElement("span");
    s.className = "typetag"; s.style.cssText = "color:" + info.color + ";border:1px solid " + info.color + "55;background:" + info.color + "18";
    s.textContent = zh ? info.zh : info.en; tags.appendChild(s);
  });
  if (!r.types.length) {
    const s = document.createElement("span"); s.className = "typetag";
    s.style.cssText = "color:#3ddc97;border:1px solid #3ddc9766;background:#3ddc9718";
    s.textContent = zh ? "無危險信號" : "No danger signals"; tags.appendChild(s);
  }
  // flags
  const fl = UI.$("flagList"); fl.innerHTML = "";
  if (!r.hits.length) {
    const d = document.createElement("div"); d.className = "flag ok";
    d.innerHTML = "<b>" + (zh ? "✓ 未觸發任何規則" : "✓ No rules triggered") + "</b>" +
      (zh ? "呢則訊息無明顯紅旗。仍然要留意：官方機構唔會經 SMS 連結收款。" :
            "No obvious red flags. Still: legitimate institutions never take payment via SMS links.");
    fl.appendChild(d);
  }
  r.hits.forEach(h => {
    const d = document.createElement("div"); d.className = "flag" + (h.w < 0 ? " ok" : "");
    const label = zh ? h.zh : h.en;
    d.innerHTML = "<b>" + (h.w > 0 ? "🚩 " + h.w + " 分" : "✓ " + Math.abs(h.w) + " 分") + " ・ " + label + "</b>";
    fl.appendChild(d);
  });
  // actions
  const acts = UI.$("actList"); acts.innerHTML = "";
  const A = r.level === "clean" || r.level === "low" ? [
    zh ? "✅ 唔好放鬆：唔好經 SMS 連結登入任何帳戶" : "✅ Stay sharp: never log in through SMS links",
    zh ? "✅ 有懷疑即打 18222 查證" : "✅ In doubt, call 18222 to verify"
  ] : [
    zh ? "🛑 唔好付款、唔好回覆、唔好撳連結" : "🛑 Do not pay, reply, or click any link",
    zh ? "📞 用官方 App／官網自行搵聯絡方法核實（唔好用訊息入面嘅）" : "📞 Verify via the official app/site you find yourself — never the contact inside the message",
    zh ? "📲 用「防騙視伏App」查電話／戶口／網站" : "📲 Check the phone/account/site with the Scameter / anti-scam app",
    zh ? "🚔 已經俾咗錢？即刻報警 999 或 ADCC 18222，並聯絡銀行" : "🚔 Already paid? Call 999 or ADCC 18222 immediately and contact your bank"
  ];
  A.forEach(a => { const d = document.createElement("div"); d.className = "act";
    d.innerHTML = '<div class="ai">→</div><div>' + a + "</div>"; acts.appendChild(d); });
  STATE.data.shieldChecks = (STATE.data.shieldChecks || 0) + 1;
  STATE.data.ms.ms4 = true; STATE.save(); UI.renderJourney();
  UI.toast(I18N.t("toastShield"));
}
function renderRulesList() {
  const zh = STATE.data.lang === "zh";
  const wrap = UI.$("rulesList"); wrap.innerHTML = "";
  SHIELD.RULES.forEach((r, i) => {
    const c = document.createElement("div"); c.className = "card";
    const t = SHIELD.TYPES[r.type];
    c.innerHTML = '<h2><span class="n">' + (i + 1) + "</span>" + (zh ? r.zh : r.en) + "</h2>" +
      '<div class="sub" style="margin-top:8px"><span class="typetag" style="color:' + t.color + ";border:1px solid " + t.color + '55;background:' + t.color + '18">' + (zh ? t.zh : t.en) + "</span> " +
      '<span class="typetag" style="color:#f5c451;border:1px solid #f5c45155;background:#f5c45118">+' + r.w + "</span></div>";
    wrap.appendChild(c);
  });
}
UI.renderRules = renderRulesList;

/* ── Grow logic ─────────────────────────────────────────────────── */
function addGrow() {
  const name = UI.$("giName").value.trim(), cost = +UI.$("giCost").value, gain = +UI.$("giGain").value;
  if (!name || !cost) { UI.toast(STATE.data.lang === "zh" ? "填項目同成本先" : "Enter item and cost"); return; }
  STATE.data.grow.push({ name, cost, gain: gain || 0, cat: UI.$("giCat").value });
  STATE.data.ms.ms5 = true; STATE.save();
  UI.$("giName").value = UI.$("giCost").value = UI.$("giGain").value = "";
  renderGrow(); UI.renderJourney(); UI.toast(I18N.t("toastSaved"));
}
function delGrow(i) { STATE.data.grow.splice(i, 1); STATE.save(); renderGrow(); }
function renderGrow() {
  const zh = STATE.data.lang === "zh";
  const list = UI.$("growList"); if (!list) return;
  list.innerHTML = "";
  if (!STATE.data.grow.length) {
    list.innerHTML = '<div class="sub">（' + (zh ? "仲未有記錄" : "nothing logged yet") + "）</div>";
  }
  STATE.data.grow.forEach((g, i) => {
    const payback = g.gain > 0 ? (g.cost / g.gain).toFixed(1) + (zh ? " 個月" : " mo") : "—";
    const d = document.createElement("div"); d.className = "growitem";
    d.innerHTML = '<div class="gi-main"><div class="gi-t">' + g.name + "</div>" +
      '<div class="gi-m">' + UI.fmt(g.cost) + " → +" + UI.fmt(g.gain) + "/mo</div></div>" +
      '<div class="gi-r"><b>' + payback + "</b><span>" + (zh ? "回本期" : "payback") + "</span></div>" +
      '<button class="del" onclick="delGrow(' + i + ')">✕</button>';
    list.appendChild(d);
  });
  const s = GROW.stats(STATE.data.grow);
  UI.$("gs_total").textContent = UI.fmt(s.total);
  UI.$("gs_month").textContent = UI.fmt(s.monthly) + "/mo";
  const net = STATE.data._net || TAX.payslip(STATE.data.salary).net;
  UI.$("gs_pb").textContent = isFinite(s.payback) ? s.payback.toFixed(1) + (zh ? " 個月" : " mo") : "—";
  UI.$("gs_vs").textContent = s.monthly > 0 ? Math.round(s.monthly / net * 100) + "%" : "—";
}

/* ── Check-in logic (growth loop) ───────────────────────────────── */
function ciPreview() {
  const need = +UI.$("ci_need").value, want = +UI.$("ci_want").value;
  UI.$("civ_need").textContent = UI.fmt(need); UI.$("civ_want").textContent = UI.fmt(want);
}
function saveCheckin() {
  const need = +UI.$("ci_need").value, want = +UI.$("ci_want").value;
  const week = STATE.data.checkins.length + 1;
  STATE.data.checkins.push({ week, need, want });
  // progress journey: 4 checkins => day advances
  if (STATE.data.checkins.length >= 4) { STATE.data.day = 60; STATE.data.ms.ms3 = true; }
  if (STATE.data.checkins.length >= 8) { STATE.data.day = 90; STATE.data.ms.ms6 = true; }
  STATE.save(); renderCheckins(); UI.renderJourney(); UI.toast(I18N.t("toastSaved"));
}
function renderCheckins() {
  const zh = STATE.data.lang === "zh";
  const h = UI.$("ciHistory"); if (!h) return;
  h.innerHTML = "";
  if (!STATE.data.checkins.length) { h.innerHTML = '<div class="sub">（' + (zh ? "仲未有記錄" : "no logs yet") + "）</div>"; return; }
  const net = STATE.data._net || TAX.payslip(STATE.data.salary).net;
  const budgetN = net * STATE.data.alloc.need / 100, budgetW = net * STATE.data.alloc.want / 100;
  STATE.data.checkins.slice(-5).reverse().forEach(c => {
    const over = (c.need + c.want) > (budgetN + budgetW) * 1.05;
    const d = document.createElement("div"); d.className = "act";
    d.innerHTML = '<div class="ai">' + (over ? "⚠️" : "✅") + '</div><div><b>W' + c.week + "</b> ・ " +
      UI.fmt(c.need) + (zh ? " 必要" : " needs") + " + " + UI.fmt(c.want) + (zh ? " 想要" : " wants") +
      " <span style='color:var(--ink3)'>" + (over ? I18N.t("ciOver") : I18N.t("ciGood")) + "</span></div>";
    h.appendChild(d);
  });
  UI.renderQuests && UI.renderQuests();
}
UI.renderQuests = function () {
  const zh = STATE.data.lang === "zh";
  const wrap = UI.$("questList"); if (!wrap) return;
  const q = STATE.data.quests;
  const defs = [
    { id: "q1", t: zh ? "完成一次防騙檢測" : "Run one scam check", s: zh ? "任何可疑訊息都可以" : "Any suspicious message", done: !!STATE.data.ms.ms4 },
    { id: "q2", t: zh ? "記錄一筆投資自己" : "Log one self-investment", s: zh ? "課程、工具、副業" : "Course, tool, side business", done: STATE.data.grow.length >= 1 },
    { id: "q3", t: zh ? "每週 check-in 一次" : "One weekly check-in", s: zh ? "30 秒記低使費" : "30-second spend log", done: STATE.data.checkins.length >= 1 }
  ];
  wrap.innerHTML = "";
  defs.forEach(d => {
    const el = document.createElement("div"); el.className = "quest";
    el.innerHTML = '<div class="qq"><b>' + (d.done ? "✅ " : "🎯 ") + d.t + "</b><span>" + d.s + "</span></div>" +
      '<button class="questbtn" ' + (d.done ? "disabled" : "") + ">" + (zh ? "去做" : "DO IT") + "</button>";
    el.querySelector("button").onclick = () => {
      if (d.id === "q1") go("shield"); else if (d.id === "q2") go("grow"); else go("checkin");
    };
    wrap.appendChild(el);
  });
};

/* ── Journey render ─────────────────────────────────────────────── */
UI.renderJourney = function () {
  const d = STATE.data;
  const done = ["ms1","ms2","ms3","ms4","ms5","ms6"].filter(k => d.ms[k]).length;
  const pct = Math.min(1, done / 6);
  UI.$("jringFg").style.strokeDashoffset = 314 - 314 * pct;
  UI.$("jringNum").textContent = "D" + (d.day || 0);
  ["ms1","ms2","ms3","ms4","ms5","ms6"].forEach(k => UI.$(k).classList.toggle("done", !!d.ms[k]));
  UI.$("jt1v").textContent = d.ms.ms1 ? "✓" : "";
  UI.$("jt2v").textContent = d.ms.ms3 ? "✓" : "";
  UI.$("jt3v").textContent = d.ms.ms5 ? "✓" : "";
  UI.$("jt1").classList.toggle("done", !!d.ms.ms1);
  UI.$("jt2").classList.toggle("done", !!d.ms.ms3);
  UI.$("jt3").classList.toggle("done", !!d.ms.ms5);
  renderGrow();
};

/* ── Deals (educational student-saving starter list) ───────────── */
const DEALS = [
  { zh: "🚇 學生八達通 — 港鐵學生乘車優惠", en: "🚇 Student Octopus — MTR student fare", s: "zh" ? "" : "" },
  { zh: "🎬 戲院學生票／週二早場", en: "🎬 Cinema student tickets / Tuesday early shows" },
  { zh: "🍜 大學飯堂 vs 外食 — 每餐慳 HK$20–40", en: "🍜 University canteen vs eating out — save HK$20–40 per meal" },
  { zh: "💻 軟件學生授權（Office／Adobe 等）", en: "💻 Student software licences (Office/Adobe etc.)" },
  { zh: "📱 電話上台學生計劃比較", en: "📱 Compare student mobile plans before contracting" },
  { zh: "🛒 優惠平台／銀行信用卡現金回贈（小心年費）", en: "🛒 Deals platforms / bank cashback (watch annual fees)" }
];
function renderDeals() {
  const zh = STATE.data.lang === "zh";
  const el = UI.$("dealsList"); if (!el) return;
  el.innerHTML = "";
  DEALS.forEach(d => {
    const row = document.createElement("div"); row.className = "act";
    row.innerHTML = '<div class="ai">✓</div><div>' + (zh ? d.zh : d.en) + "</div>";
    el.appendChild(row);
  });
}
function shareRunway() {
  const net = STATE.data._net || TAX.payslip(STATE.data.salary).net;
  const essentials = net * STATE.data.alloc.need / 100;
  const months = (STATE.data.saved / essentials).toFixed(1);
  const zh = STATE.data.lang === "zh";
  const text = zh
    ? "我的失業跑道而家有 " + months + " 個月 🛡️ 用 FirstPayHK 規劃你的第一份人工！#第一份人工 #FirstPayHK"
    : "My money runway is now " + months + " months 🛡️ Planned with FirstPayHK — your first paycheck, without the panic! #FirstPayHK";
  if (navigator.share) { navigator.share({ text }).catch(() => {}); }
  else {
    navigator.clipboard && navigator.clipboard.writeText(text).catch(() => {});
    UI.toast(zh ? "已複製分享文字 ✓" : "Share text copied ✓");
  }
}

/* ── misc wiring ────────────────────────────────────────────────── */
function toggleLang() {
  STATE.data.lang = STATE.data.lang === "zh" ? "en" : "zh"; STATE.save(); UI.applyLang();
}
function go(s) { UI.go(s); }
function resetDemo() { STATE.reset(); location.reload(); }
// bind global handlers onto UI so applyLang's `this` is always correct
UI.renderCheckins = renderCheckins;
UI.renderGrow = renderGrow;
// (UI.renderQuests is already a UI method — no binding needed)

/* ── boot: init + self-tests ────────────────────────────────────── */
(function boot() {
  STATE.load();
  const okTax = TAX.selfTest();
  const okShield = SHIELD.selfTest();
  console.log("[BOOT] self-tests:", { okTax, okShield });
  window.__SELFTEST__ = { okTax, okShield };   // exposed for E2E verification
  UI.$("salaryIn").value = STATE.data.salary;
  UI.$("r_need").value = STATE.data.alloc.need;
  UI.$("r_want").value = STATE.data.alloc.want;
  UI.$("r_start").value = STATE.data.saved;
  UI.$("r_save").value = STATE.data.monthlySave;
  UI.applyLang();
  ciPreview();
  renderCheckins();
  renderGrow();
  UI.renderJourney();
})();
</script>
